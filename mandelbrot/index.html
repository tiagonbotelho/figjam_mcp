<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mandelbrot Renderer</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: sans-serif; }
  #canvas { display: block; cursor: crosshair; }
  #ui {
    position: fixed; top: 10px; left: 10px; color: #eee;
    background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    font-size: 13px; line-height: 1.5; user-select: none;
  }
  #ui label { display: inline-block; width: 90px; }
  #ui input[type=range] { vertical-align: middle; }
  #ui button { margin-top: 4px; cursor: pointer; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <div><strong>Mandelbrot Renderer</strong></div>
  <div>Scroll / pinch to zoom &middot; Drag to pan &middot; Click to zoom in</div>
  <div>
    <label>Iterations</label>
    <input type="range" id="iter" min="50" max="2000" step="10" value="300">
    <span id="iterVal">300</span>
  </div>
  <div>
    <label>Palette</label>
    <select id="palette">
      <option value="classic">Classic</option>
      <option value="fire">Fire</option>
      <option value="ocean">Ocean</option>
      <option value="grayscale">Grayscale</option>
    </select>
  </div>
  <button id="reset">Reset View</button>
  <button id="save">Save PNG</button>
</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', () => { resize(); render(); });
resize();

// View state: center point in the complex plane + scale (real-units per pixel)
const DEFAULT_VIEW = { cx: -0.5, cy: 0, scale: 3.0 / Math.min(window.innerWidth, window.innerHeight) };
let view = { ...DEFAULT_VIEW };

const iterSlider = document.getElementById('iter');
const iterVal = document.getElementById('iterVal');
const paletteSelect = document.getElementById('palette');
let maxIter = parseInt(iterSlider.value, 10);

iterSlider.addEventListener('input', () => {
  maxIter = parseInt(iterSlider.value, 10);
  iterVal.textContent = maxIter;
  render();
});
paletteSelect.addEventListener('change', render);
document.getElementById('reset').addEventListener('click', () => {
  view = { cx: -0.5, cy: 0, scale: 3.0 / Math.min(window.innerWidth, window.innerHeight) };
  render();
});
document.getElementById('save').addEventListener('click', () => {
  const link = document.createElement('a');
  link.download = 'mandelbrot.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});

function palette(name, t) {
  // t is normalized escape value in [0,1); returns [r,g,b]
  if (name === 'grayscale') {
    const v = Math.floor(255 * t);
    return [v, v, v];
  }
  if (name === 'fire') {
    const r = Math.min(255, Math.floor(t * 400));
    const g = Math.min(255, Math.floor(t * 200));
    const b = Math.min(255, Math.floor(t * 80));
    return [r, g, b];
  }
  if (name === 'ocean') {
    const r = Math.floor(20 + t * 30);
    const g = Math.floor(60 + t * 150);
    const b = Math.floor(120 + t * 135);
    return [r, Math.min(255,g), Math.min(255,b)];
  }
  // classic smooth palette
  const r = Math.floor(9 * (1 - t) * t * t * t * 255);
  const g = Math.floor(15 * (1 - t) * (1 - t) * t * t * 255);
  const b = Math.floor(8.5 * (1 - t) * (1 - t) * (1 - t) * t * 255);
  return [r, g, b];
}

function mandelbrotEscape(px, py, maxIter) {
  let x = 0, y = 0, x2 = 0, y2 = 0, iter = 0;
  while (x2 + y2 <= 4 && iter < maxIter) {
    y = 2 * x * y + py;
    x = x2 - y2 + px;
    x2 = x * x;
    y2 = y * y;
    iter++;
  }
  if (iter >= maxIter) return maxIter;
  // smooth coloring
  const log_zn = Math.log(x2 + y2) / 2;
  const nu = Math.log(log_zn / Math.log(2)) / Math.log(2);
  return iter + 1 - nu;
}

function render() {
  const imageData = ctx.createImageData(width, height);
  const data = imageData.data;
  const paletteName = paletteSelect.value;

  for (let py = 0; py < height; py++) {
    const cy = view.cy + (py - height / 2) * view.scale;
    for (let px = 0; px < width; px++) {
      const cx = view.cx + (px - width / 2) * view.scale;
      const escape = mandelbrotEscape(cx, cy, maxIter);
      const idx = (py * width + px) * 4;
      if (escape >= maxIter) {
        data[idx] = 0; data[idx+1] = 0; data[idx+2] = 0; data[idx+3] = 255;
      } else {
        const t = escape / maxIter;
        const [r, g, b] = palette(paletteName, t);
        data[idx] = r; data[idx+1] = g; data[idx+2] = b; data[idx+3] = 255;
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// Interaction: drag to pan, wheel to zoom, click to zoom in
let dragging = false, lastX = 0, lastY = 0, moved = false;

canvas.addEventListener('mousedown', e => {
  dragging = true; moved = false; lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  if (Math.abs(dx) > 2 || Math.abs(dy) > 2) moved = true;
  view.cx -= dx * view.scale;
  view.cy -= dy * view.scale;
  lastX = e.clientX; lastY = e.clientY;
  render();
});
window.addEventListener('mouseup', e => {
  if (dragging && !moved) {
    // click = zoom in centered on click point
    const cx = view.cx + (e.clientX - width / 2) * view.scale;
    const cy = view.cy + (e.clientY - height / 2) * view.scale;
    view.cx = cx; view.cy = cy;
    view.scale *= 0.5;
    render();
  }
  dragging = false;
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 0.85 : 1 / 0.85;
  const cx = view.cx + (e.clientX - width / 2) * view.scale;
  const cy = view.cy + (e.clientY - height / 2) * view.scale;
  view.scale *= zoomFactor;
  // keep point under cursor fixed
  view.cx = cx - (e.clientX - width / 2) * view.scale;
  view.cy = cy - (e.clientY - height / 2) * view.scale;
  render();
}, { passive: false });

render();
</script>
</body>
</html>
